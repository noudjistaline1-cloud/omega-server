services:
  # Un SEUL service web gratuit : le serveur + le world_scanner dans le même processus (Render Free n'a pas de worker).
  - type: web
    name: omega-titan-server
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn staline_server:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: STALINE_API_KEY
        value: STALINE-ULTRA-KEY-2025
      - key: FINNHUB_API_KEY
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: OMEGA_SERVER_URL
        value: https://omega-server-90mu.onrender.com
      - key: OMEGA_FORCE_CLOSE_ENABLED
        value: "false"
      - key: RUN_WORLD_SCANNER_IN_WEB
        value: "true"
      - key: PUSH_INTERVAL_SEC
        value: "30"
      - key: PYTHONUNBUFFERED
        value: "1"

  # Option PAYANTE (plan Starter) : worker séparé. Si vous l'activez, mettez RUN_WORLD_SCANNER_IN_WEB à "false" ci-dessus.
